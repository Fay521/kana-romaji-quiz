<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日语五十音测试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1 id="pageTitle">五十音小测试</h1>
    <p id="pageSubtitle">五十音练习 · 手写笔画显示 · 手写体显示 · 错题本 · 五十音一览</p>
  </header>

  <!-- ===== 设置界面 ===== -->
  <div id="setupScreen">
    <div class="card">
      <div class="section-title">文字类型</div>
      <div class="script-toggle" id="scriptToggle">
        <button data-script="hiragana" class="active">平假名</button>
        <button data-script="katakana">片假名</button>
        <button data-script="both">我全都要</button>
      </div>
    </div>
    <div class="card">
      <div class="section-title">选择要测试的行</div>
      <div class="select-all-row">
        <button onclick="selectAll(true)">全选</button>
        <button onclick="selectAll(false)">全部取消</button>
      </div>
      <div class="row-grid" id="rowGrid"></div>
      <button class="collapse-toggle" id="dakuonRowToggle" onclick="toggleCollapse('dakuonRowToggle','dakuonRowBody')" style="margin-top:14px">
        <span>浊音・半浊音</span><span class="arrow">▼</span>
      </button>
      <div class="collapse-body" id="dakuonRowBody">
        <div class="row-grid" id="dakuonRowGrid" style="margin-top:14px"></div>
      </div>
      <button class="collapse-toggle" id="youonRowToggle" onclick="toggleCollapse('youonRowToggle','youonRowBody')" style="margin-top:14px">
        <span>拗音</span><span class="arrow">▼</span>
      </button>
      <div class="collapse-body" id="youonRowBody">
        <div class="row-grid" id="youonRowGrid" style="margin-top:14px"></div>
      </div>
    </div>
    <button class="start-btn" onclick="startTest()">开始测试 ▶</button>

    <div class="big_card" style="display: flex;gap: 20px">
          <div class="card book-card" onclick="openChart()">
      <div class="book-icon">📖</div>
      <div class="book-text">
        <div class="book-title">五十音一览</div>
        <div class="book-sub">查看全部假名与笔顺</div>
      </div>
    </div>
    <div class="card book-card" onclick="openMistakeBook()">
      <div class="book-icon">📚</div>
      <div class="book-text">
        <div class="book-title">错题本</div>
        <div class="book-sub">点击查看、练习错题</div>
      </div>
      <div class="book-badge" id="bookCountBadge">0</div>
    </div>
    </div>
    
  </div>

  <!-- ===== 测试界面 ===== -->
  <div id="testScreen" class="hidden">
    <div class="card">
      <div class="progress-bar">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">0 / 0</div>
      </div>
      <div class="score-bar">
        <div class="score-item"><span class="dot dot-correct"></span>&nbsp;正确: <span id="correctCount">0</span></div>
        <div class="score-item"><span class="dot dot-wrong"></span>&nbsp;错误: <span id="wrongCount">0</span></div>
        <div class="score-item hidden" id="masteredWrap"><span class="dot" style="background:#f39c12"></span>&nbsp;已掌握: <span id="masteredCount">0</span></div>
      </div>
      <div class="test-area">
        <div><span class="kana-type-badge" id="kanaTypeBadge"></span></div>
        <div class="kana-display" id="kanaDisplay"></div>
        <div class="alt-hint">💡 chi可输ti，tsu可输tu，shi→si，fu→hu，ji→zi 等多种罗马字均可</div>
        <div class="input-area">
          <input type="text" id="romajiInput" placeholder="  " autocomplete="off" autocapitalize="off" spellcheck="false">
          <button onclick="checkAnswer()">✓</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="test-actions">
          <button onclick="skipQuestion()">跳过</button>
          <button class="btn-next hidden" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
          <button onclick="endTest()">结束测试</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 结果界面 ===== -->
  <div id="resultScreen" class="hidden">
    <div class="card result-screen">
      <div class="section-title" style="justify-content:center;" id="resultTitle">测试结果</div>
      <div class="result-score" id="resultScore"></div>
      <div class="result-label" id="resultLabel"></div>
      <div class="result-detail">
        <div><div class="num" id="resCorrect" style="color:var(--success)"></div>正确</div>
        <div><div class="num" id="resWrong" style="color:var(--danger)"></div>错误</div>
        <div><div class="num" id="resTotal"></div>总计</div>
      </div>
      <div class="mistakes-section hidden" id="mistakesSection">
        <h3>📝 本次错题：</h3>
        <div class="mistake-list" id="mistakeList"></div>
      </div>
      <div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="start-btn" style="max-width:260px" onclick="restartSame()">再来一次 ▶</button>
        <button class="hidden" id="resPracticeBtn" style="padding:14px 22px;border:2px solid #f39c12;border-radius:12px;background:#fff8e1;color:#856404;font-size:1em;font-weight:700;cursor:pointer;font-family:inherit" onclick="startMistakePractice()">📚 练习错题</button>
        <button style="padding:14px 22px;border:2px solid var(--border);border-radius:12px;background:var(--card);font-size:1em;font-weight:600;cursor:pointer;font-family:inherit" onclick="goSetup()">返回设置</button>
      </div>
    </div>
  </div>

  <!-- ===== 错题本界面 ===== -->
  <div id="mistakeBookScreen" class="hidden">
    <div class="card">
      <div class="section-title">📚 错题本</div>
      <div class="book-stats" id="bookStats"></div>
      <div id="bookList"></div>
    </div>
    <div class="book-actions">
      <button class="start-btn" id="bookPracticeBtn" style="max-width:100%" onclick="startMistakePractice()">练习错题 ▶</button>
      <div class="book-bottom-row">
        <button class="btn-danger" onclick="clearAllMistakes()">🗑 清空错题本</button>
        <button onclick="goSetup()">← 返回设置</button>
      </div>
    </div>
  </div>

  <!-- ===== 五十音一览界面 ===== -->
  <div id="chartScreen" class="hidden">
    <div class="card">
      <div class="section-title">清音（五十音）</div>
      <div id="seionChart"></div>

      <div class="chart-section">
        <button class="collapse-toggle" id="dakuonToggle" onclick="toggleCollapse('dakuonToggle','dakuonBody')">
          <span>浊音・半浊音</span><span class="arrow">▼</span>
        </button>
        <div class="collapse-body" id="dakuonBody">
          <div id="dakuonChart" style="margin-top:16px"></div>
        </div>
      </div>

      <div class="chart-section">
        <button class="collapse-toggle" id="youonToggle" onclick="toggleCollapse('youonToggle','youonBody')">
          <span>拗音</span><span class="arrow">▼</span>
        </button>
        <div class="collapse-body" id="youonBody">
          <div id="youonChart" style="margin-top:16px"></div>
        </div>
      </div>

      <div class="chart-section hidden" id="gaiSection">
        <div class="section-title">外来语</div>
        <div class="chart-flow" id="gaiChart"></div>
      </div>

      <!-- <div class="chart-note">💡 点击任意假名可查看笔顺动画</div> -->
      <button class="start-btn" style="margin-top:16px" onclick="goSetup()">← 返回设置</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <a href="https://github.com/Fay521/kana-romaji-quiz" target="_blank" rel="noopener">本项目已开源至GitHub</a>
  <span>丨</span>
  <a href="https://x.com/Kiss_light233" target="_blank" rel="noopener">Twitter</a>
  <br>
  <span class="copyright">© 2025 Light.非常感谢你的访问使用</span>
</footer>

<!-- ===== 笔画弹窗 ===== -->
<div class="modal-overlay hidden" id="strokeModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">笔画详情</div>
      <button class="modal-close" onclick="closeStrokeModal()">✕</button>
    </div>
    <div class="dual-stage" id="dualStage"></div>
    <div class="modal-romaji" id="modalRomaji"></div>
    <div class="modal-stroke-count" id="modalStrokeCount"></div>
    <div class="stroke-num-toggle" id="numToggleWrap">
      <label><input type="checkbox" id="strokeNumToggle" checked onchange="toggleStrokeNums(this.checked)"> 显示笔画数字</label>
    </div>
    <!-- 底部重播（后续添加声音）
    <div class="stroke-actions">
      <button class="btn-replay" id="replayBtn" onclick="replayStroke()">▶ 重播</button>
    </div>
    -->
  </div>
</div>

<script src="js/stroke-data.js"></script>
<script src="js/kana-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
